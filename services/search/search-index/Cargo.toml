[package]
name = "search-index"
version = "0.1.0"
edition = "2024"

[dependencies]

# ---------- Async runtime ----------
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# ---------- OpenTelemetry (modern split architecture) ----------
# API (no runtime here anymore)
opentelemetry = "0.21"

# SDK (runtime + providers live here now)
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }

# OTLP exporter (gRPC collector, Jaeger, Tempo, etc.)
opentelemetry-otlp = { version = "0.15", features = ["grpc-tonic", "trace", "metrics"] }

# Prometheus exporter (metrics pull model)
opentelemetry-prometheus = "0.15"

# tracing <-> opentelemetry bridge (you WILL need this)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.22"

# ---------- Metrics (native Rust metrics crate) ----------
metrics = "0.23"
metrics-exporter-prometheus = "0.13"

# ---------- Kafka ----------
rdkafka = { version = "0.36", features = ["tokio"] }

# ---------- Search ----------
meilisearch-sdk = "0.26"

# ---------- Serialization ----------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.12"

[build-dependencies]
prost-build = "0.12"
