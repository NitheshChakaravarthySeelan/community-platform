[package]
name = "search-query"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.10"
prost = "0.12"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
meilisearch-sdk = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.5", features = ["cors"] }

[build-dependencies]
tonic-build = "0.10"
