[tool.poetry]
name = "checkout-orchestrator"
version = "0.1.0"
description = ""
authors = ["NitheshChakaravarthySeelan <albertnitheesh@gmail.com>"]
readme = "README.md"
packages = [{include = "checkout_orchestrator"}]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = ">=0.120.0,<0.121.0"
uvicorn = ">=0.38.0,<0.39.0"
pydantic = {version = ">=2.12.3,<3.0.0", extras = ["dotenv"]}
httpx = ">=0.28.1,<0.29.0"
opentelemetry-distro = "*"
opentelemetry-exporter-otlp = "*"
opentelemetry-instrumentation-fastapi = "*"
prometheus-client = "*"
aiokafka = ">=0.10.0"
asyncpg = ">=0.29.0,<0.30.0"
databases = ">=0.8.0,<0.9.0"
pybreaker = ">=1.0.0,<2.0.0"
protobuf = "<3.21.0"
aiosqlite = ">=0.19.0,<0.20.0"
python-dotenv = ">=1.2.1,<2.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
ruff = "^0.4.8"
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
respx = "^0.21.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

