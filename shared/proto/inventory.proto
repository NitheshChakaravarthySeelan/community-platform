syntax = "proto3";

package inventory;

import "common.proto";

// Service for checking and potentially managing inventory levels
service InventoryService {
  // Checks the current stock level for a product
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
}

// --- Commands ---

message ReserveInventoryCommand {
  common.SagaMetadata metadata = 1;
  string user_id = 2;
  string order_id = 3;
  repeated InventoryItem items = 4;
}

message ReleaseInventoryCommand {
  common.SagaMetadata metadata = 1;
  string order_id = 2;
  repeated InventoryItem items = 3;
}

message InventoryItem {
  string product_id = 1;
  int32 quantity = 2;
}

// --- Events ---

message InventoryReservedEvent {
  common.SagaMetadata metadata = 1;
  string order_id = 2;
  string user_id = 3;
}

message InventoryReservationFailedEvent {
  common.SagaMetadata metadata = 1;
  string order_id = 2;
  string user_id = 3;
  string reason = 4;
}

message InventoryReleasedEvent {
  common.SagaMetadata metadata = 1;
  string order_id = 2;
}

// --- Requests/Responses ---

// Request to check stock for a given product and quantity
message CheckStockRequest {
  string product_id = 1;
  int32 quantity = 2; // The quantity to check availability for
}

// Response indicating stock availability and current level
message CheckStockResponse {
  string product_id = 1;
  bool available = 2;
  int32 current_stock = 3;
  string message = 4; // Optional message, e.g., "Not enough stock"
}
