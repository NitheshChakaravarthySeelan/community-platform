syntax = "proto3";

package search;

option java_package = "com.community.search";
option go_package = "github.com/community-platform/search;search";

service SearchService {
  rpc SearchProducts (SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message SearchResponse {
  repeated ProductResult products = 1;
}

message ProductResult {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string category = 5;
  string image_url = 6;
}
