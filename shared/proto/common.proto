syntax = "proto3";

package common;

option java_package = "com.community.platform.shared.proto.common";
option java_multiple_files = true;
option go_package = "github.com/community-platform/shared/proto/common;common";

import "google/protobuf/timestamp.proto";

message Money {
  string currency_code = 1; // e.g., "USD"
  int64 amount_cents = 2;   // Amount in cents
}

message Address {
  string full_name = 1;
  string street_address = 2;
  string city = 3;
  string state_province = 4;
  string postal_code = 5;
  string country = 6;
  string phone_number = 7;
}

message OrderItem {
  string product_id = 1;
  string name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
  int64 total_price_cents = 5;
}

message SagaMetadata {
  string saga_id = 1;
  string event_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  string reply_to_topic = 4;
}
